kind = "web"
previewPath = "/"
title = "Invitación de XV Años"
description = "Una invitación web de cuento para celebrar unos quince años inspirados en Rapunzel, con detalles del evento y confirmación de asistencia."
version = "1.0.0"
id = "artifacts/rapunzel-quince"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23779

[services.development]
run = "pnpm --filter @workspace/rapunzel-quince run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rapunzel-quince", "run", "build" ]
serve = "static"
publicDir = "artifacts/rapunzel-quince/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23779"
BASE_PATH = "/"
